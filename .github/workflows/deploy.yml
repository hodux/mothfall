name: Deploy Mothfall

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Build & Restart
        run : |
          docker compose up -d --build --remove-orphans
          docker image prune -f
